<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crop Recommendation</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/predict.css') }}">
</head>

<body style="background:#BCBBB8">
  <!--=======================navbar=====================================================-->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="{{url_for('hero')}}">Crop Yield Prediction</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

    </div>
  </nav>

  <div class="container my-3 mt-3">
    <h1 class="text-success">Crop Yield Prediction System <span class="text-success"></span></h1>


    <form action="/yields" method="POST">
      <div class="row">
        <div class="col-md-4">
          <label for="Year">Year</label>
          <input type="number" id="Year" name="Year" placeholder="Enter Year" class="form-control" step="any">
        </div>
        <div class="col-md-4">
          <label for="average_rain_fall_mm_per_year">average_rain_fall_mm_per_year</label>
          <input type="number" id="average_rain_fall_mm_per_year" name="average_rain_fall_mm_per_year"
            placeholder="Enter average_rain_fall_mm_per_year" class="form-control" step="any">
        </div>
        <div class="col-md-4">
          <label for="pesticides_tonnes">pesticides_tonnes</label>
          <input type="number" id="pesticides_tonnes" name="pesticides_tonnes" placeholder="Enter pesticides_tonnes"
            class="form-control" step="any">
        </div>
      </div>

      <div class="row mt-4">
        <div class="col-md-4">
          <label for="avg_temp">avg_temp</label>
          <input type="number" id="avg_temp" name="avg_temp" placeholder="Enter avg_temp" class="form-control"
            step="any">
        </div>
        <div class="col-md-4">
          <label for="Area">Area</label>
          <input type="text" id="Area" name="Area" placeholder="Enter Area(India)" class="form-control">
        </div>
        <div class="col-md-4">
          <label for="Item">Item</label>
          <input type="text" id="Item" name="Item" placeholder="Enter Item(Maize)" class="form-control">
        </div>
      </div>

      <div class="row mt-4">

        <div class="col-md-12 text-center">
          <button type="submit" class="btn btn-primary btn-lg">Get Recommendation</button>
        </div>
      </div>
    </form>



    {% if prediction %}
    <div class="card bg-dark" style="width: 18rem;margin: 20px auto 0;">
      <img src="{{url_for('static', filename='images/img.jpg')}}" class="card-img-top" alt="...">
      <div class="card-body">
        <h5 class="card-title">Recommend Crop Yield is:</h5>
        <p class="card-text"> {{ prediction }} hg/ha </p>
        <p class="card-text">1 hg = 100 grams</p>
      </div>
    </div>
    {% endif %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe"
    crossorigin="anonymous"></script>
</body>

</html>
