<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farmer Consultancy Form</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/consultancy.css') }}">
</head>

<body>
  <div class="container">
    <h1>Farmer's Consultancy Form</h1>
    <form id="consultancy-form" action="/consultancy-form" method="post">
      <div class="form-group">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>
      </div>
      <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="form-group">
        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone" required>
      </div>
      <div class="form-group">
        <label for="preferred-time">Preferred Time:</label>
        <input type="text" id="preferred-time" name="preferred-time">
      </div>
      <div class="form-group">
        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="4" required></textarea>
      </div>
      <button type="submit">Submit</button>
    </form>
  </div>
</body>

</html>
