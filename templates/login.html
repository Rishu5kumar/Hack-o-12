<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/loginstyle.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
<div class="container" id="container">
    <div class="form-container sign-up-container">
        <form action="{{ url_for('signup') }}" method="post">
            <h1>Create Account</h1>
            <div class="social-container">
                <a href="https://www.facebook.com/" class="social"><i class="fab fa-facebook-f"></i></a>
                <a href="https://www.google.com/" class="social"><i class="fab fa-google-plus-g"></i></a>
                <a href="https://www.linkedin.com/" class="social"><i class="fab fa-linkedin-in"></i></a>
            </div>
            <span>or use your email for registration</span>
            <input type="text" placeholder="Name" id="name" name="name"/>
            <input type="email" placeholder="Email" id="email" name="email"/>
            <input type="password" placeholder="Password" id="password" name="password"/>
            <button type="submit">Sign Up</button>
        </form>
    </div>
    <div class="form-container sign-in-container">
        <form action="{{ url_for('loginfarm') }}" method="post">
            <h1>Log in</h1>
            <div class="social-container">
                <a href="https://www.facebook.com/" class="social"><i class="fab fa-facebook-f"></i></a>
                <a href="https://www.google.com/" class="social"><i class="fab fa-google-plus-g"></i></a>
                <a href="https://www.linkedin.com/" class="social"><i class="fab fa-linkedin-in"></i></a>
            </div>
            <span>or use your account</span>
            <input type="email" placeholder="Email" id="email" name="email"/>
            <input type="password" placeholder="Password" id="password" name="password"/>
            <button type="submit">Log In</button>
        </form>
    </div>
    <div class="overlay-container">
        <div class="overlay">
            <div class="overlay-panel overlay-left">
                <h1>UNLOCK YOUR FARM</h1>
                <p>To continue with us please login with your personal info</p>
                <a class="ghost" id="signIn">Log In</a>
            </div>
            <div class="overlay-panel overlay-right">
                <h1>Start journey with us</h1>
                <p></p>
                <a class="ghost" id="signUp">Sign Up</a>
            </div>
        </div>
    </div>
</div>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
<script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
